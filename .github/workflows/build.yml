name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            os: macos-26
            script: ./scripts/setup-build-env-macos.sh

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up build environment
        env:
          SUNRISE_SKIP_BUILD: '1'
        run: bash ${{ matrix.script }}

      - name: Build and package applications
        run: npm run package:all

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: project-sunrise-all
          path: |
            release/**/*.zip
            release/**/*.AppImage
          if-no-files-found: error